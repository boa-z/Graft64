name: graft64-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g1-lock:
    name: Validate G1 lock and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: ./scripts/verify-artifacts.sh
      - run: shellcheck scripts/*.sh
  host:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
      - run: ./scripts/run-host-tests.sh
      - run: xcodebuild -project app/GraftHost/GraftHost.xcodeproj -target GraftHost -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build
  unsigned-device-ipa:
    name: Build unsigned device IPA
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
      - name: Build iphoneos IPA without signing
        run: GRAFT_SDK=iphoneos GRAFT_CONFIGURATION=Release GRAFT_CODE_SIGNING_ALLOWED=NO ./scripts/build-probes.sh
      - name: Verify IPA structure
        run: ./scripts/verify-package.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GraftHost-unsigned-iphoneos
          path: |
            out/GraftHost.ipa
            out/GraftHost.ipa.sha256
            out/package-manifest.sha256
            out/entitlements.plist
          if-no-files-found: error
